apiVersion: apps/v1
kind: Deployment
metadata:
  name: munkaido-nyilvantarto
  labels:
    app.kubernetes.io/name: munkaido-nyilvantarto
    app.kubernetes.io/managed-by: munkaido-repo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: munkaido-nyilvantarto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: munkaido-nyilvantarto
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: munkaido-nyilvantarto:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: munkaido-config
          env:
            - name: DATABASE_PATH
              value: /app/data/munkaido.db
            - name: IMPORT_SEED_EXCEL
              value: "0"
            - name: APP_TIMEZONE
              value: Europe/Budapest
            - name: APPLICATION_ROOT
              value: /munkaido
            - name: TRUST_PROXY_HEADERS
              value: "1"
            - name: SESSION_COOKIE_SECURE
              value: "1"
            - name: WEBAUTHN_ORIGIN
              value: https://pmqxyz.hopto.org
            - name: WEBAUTHN_RP_ID
              value: pmqxyz.hopto.org
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: munkaido-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
