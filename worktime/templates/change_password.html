{% extends "base.html" %}
{% block title %}Jelszó módosítása · Munkaidő{% endblock %}
{% block content %}
<section class="card narrow-card">
  <p class="eyebrow">Fiókbeállítás</p><h1>Jelszó módosítása</h1>
  <form method="post" class="stack-form">
    <label>Jelenlegi jelszó<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>Új jelszó<input type="password" name="new_password" minlength="4" autocomplete="new-password" required></label>
    <label>Új jelszó még egyszer<input type="password" name="new_password_again" minlength="4" autocomplete="new-password" required></label>
    <button class="button primary" type="submit">Jelszó mentése</button>
  </form>
</section>
{% endblock %}
